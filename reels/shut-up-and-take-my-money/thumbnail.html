<!doctype html>
<html><head><meta charset="utf-8">
<link href="fonts/local.css" rel="stylesheet">
<style>
:root{--gold:#f5b942}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0b12}
.t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter Tight',sans-serif;color:#fff;
  background:radial-gradient(760px 620px at 640px 1360px,rgba(245,185,66,.16),transparent 70%),radial-gradient(900px 700px at 300px 700px,rgba(90,80,200,.18),transparent 70%),linear-gradient(180deg,#10111c,#0a0b12 55%,#07070c)}
.k{position:absolute;left:64px;font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:.5px}
.l1{top:278px;font-size:62px;color:#f2f2f5}
.l2{top:338px;font-size:108px;color:transparent;-webkit-text-stroke:2.5px #8a8ea3}
/* buying-intent meter: the bridge from looking to buying */
.meter{position:absolute;left:64px;right:64px;top:458px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.segs i{height:18px;border-radius:9px}
.lab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;font-size:22px;font-weight:800;letter-spacing:2px}
.lab span:nth-child(1){color:#8a8ea3}.lab span:nth-child(2){color:#b3a98f}.lab span:nth-child(3){color:#d8b46a}.lab span:nth-child(4){color:var(--gold)}
.l3{top:540px;font-size:62px;color:#f2f2f5}
.pay{position:absolute;left:60px;top:596px;font-family:'Anton',sans-serif;text-transform:uppercase;font-size:116px;line-height:.92;letter-spacing:.5px;
  background:linear-gradient(180deg,#ffe29a 0%,#f5b942 55%,#d9912b 100%);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 30px rgba(245,185,66,.25))}
.glow{position:absolute;left:170px;top:820px;width:740px;height:740px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,185,66,.18),transparent 70%)}
.person{position:absolute;left:168px;top:731px;height:995px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}
.fade{position:absolute;left:0;right:0;top:1640px;height:280px;background:linear-gradient(180deg,rgba(9,10,16,0) 0%,rgba(9,10,16,.85) 45%,#08080d 70%)}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body><div class="t">
  <div class="glow"></div>
  <div class="k l1">Take customers from</div>
  <div class="k l2">Just looking</div>
  <div class="meter">
    <div class="segs"><i style="background:#3a3d4f"></i><i style="background:linear-gradient(90deg,#4a4a52,#8a7a55)"></i><i style="background:linear-gradient(90deg,#8a7a55,#d39a3a)"></i><i style="background:var(--gold);box-shadow:0 0 18px rgba(245,185,66,.7)"></i></div>
    <div class="lab"><span>LOOKING</span><span>INTERESTED</span><span>CONVINCED</span><span>BUYING</span></div>
  </div>
  <div class="k l3">to</div>
  <div class="pay">“Shut up and<br>take my money.”</div>
  <img class="person" src="person.png">
  <div class="fade"></div>
  <div class="grain"></div>
</div></body></html>
