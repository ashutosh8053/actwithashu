<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;font-family:'Inter Tight',sans-serif;color:#fff;background:#0b0d26}
.bg{position:absolute;inset:0;background:
  radial-gradient(520px 320px at 300px 330px,rgba(124,92,255,.42),transparent 70%),
  radial-gradient(420px 260px at 60px 420px,rgba(34,211,238,.35),transparent 70%),
  radial-gradient(460px 340px at 1440px 120px,rgba(124,110,255,.45),transparent 70%),
  radial-gradient(500px 260px at 900px -60px,rgba(59,90,246,.28),transparent 70%),
  linear-gradient(180deg,#0e1235,#0a0a1f)}
/* fan of real website screens, left */
.rig{position:absolute;inset:0;perspective:1100px;perspective-origin:420px 190px}
.card{position:absolute;width:300px;border-radius:12px;overflow:hidden;background:#0b0912;transform-origin:100% 50%;
  box-shadow:0 30px 60px -14px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.18);
  -webkit-box-reflect:below 8px linear-gradient(transparent 62%,rgba(255,255,255,.16))}
.card .bar{height:20px;background:#16141f;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.card .bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.card .v{height:200px;overflow:hidden;background:#f6f3ec}
.card .v img{display:block;height:100%;width:100%;object-fit:cover}
.c1{left:30px;top:66px;transform:rotateY(34deg) scale(.86)}
.c2{left:150px;top:62px;transform:rotateY(22deg) scale(.93)}
.c3{left:282px;top:56px;transform:rotateY(10deg)}
.c3 .v img{object-position:50% 30%}
/* copy */
.copy{position:absolute;left:640px;width:600px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
h1{font-size:44px;line-height:1.06;letter-spacing:-1.6px;font-weight:500}
h1 b{font-weight:800}
h1 em{font-style:normal;font-weight:800;background:linear-gradient(90deg,#67e8f9,#8b7bff 55%,#c084fc);-webkit-background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.chip{height:34px;padding:0 15px;border-radius:9px;font-size:15px;font-weight:600;display:flex;align-items:center;letter-spacing:-.2px;
  background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.14));border:1px solid rgba(167,139,250,.45)}
.chip.w{background:#fff;color:#0d0f12;border-color:#fff}
/* portrait, right */
.halo{position:absolute;left:1220px;top:-20px;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(150,140,255,.5),rgba(34,211,238,.12) 60%,transparent);filter:blur(8px)}
.person{position:absolute;left:1204px;top:-56px;height:461px;filter:drop-shadow(0 0 22px rgba(0,0,0,.35))}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body><div class="b">
  <div class="bg"></div>
  <div class="rig">
    <div class="card c1"><div class="bar"><i></i><i></i><i></i></div><div class="v"><img src="coach-landing-mock.png"></div></div>
    <div class="card c2"><div class="bar"><i></i><i></i><i></i></div><div class="v"><img src="icp-clarity-screenshot.png"></div></div>
    <div class="card c3"><div class="bar"><i></i><i></i><i></i></div><div class="v"><img src="website-screenshot.png"></div></div>
  </div>
  <div class="halo"></div>
  <img class="person" src="person.png">
  <div class="copy">
    <h1>Websites, Landing Pages,<br>and <em>META ADS</em><br><b>Built to Convert.</b></h1>
    <div class="chips"><div class="chip">AI-Powered Websites</div><div class="chip">Landing Pages</div><div class="chip">Digital Products</div><div class="chip w">Meta Ads</div></div>
  </div>
  <div class="grain"></div>
</div></body></html>
