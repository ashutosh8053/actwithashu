<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;font-family:'Inter Tight',sans-serif;color:#fff;background:#0b0d26}
.bg{position:absolute;inset:0;background:
  radial-gradient(520px 320px at 300px 330px,rgba(124,92,255,.42),transparent 70%),
  radial-gradient(420px 260px at 60px 420px,rgba(34,211,238,.35),transparent 70%),
  radial-gradient(460px 340px at 1440px 120px,rgba(124,110,255,.45),transparent 70%),
  radial-gradient(500px 260px at 900px -60px,rgba(59,90,246,.28),transparent 70%),
  linear-gradient(180deg,#0e1235,#0a0a1f)}
/* fan of real website screens, left */
.rig{position:absolute;inset:0;perspective:1100px;perspective-origin:420px 190px}
.card{position:absolute;width:300px;border-radius:12px;overflow:hidden;background:#0b0912;transform-origin:100% 50%;
  box-shadow:0 30px 60px -14px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.18);
  -webkit-box-reflect:below 8px linear-gradient(transparent 62%,rgba(255,255,255,.16))}
.card .bar{height:20px;background:#16141f;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.card .bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.card .v{height:200px;overflow:hidden;position:relative}
/* motion-graphic website screens */
.m{position:absolute;inset:0;overflow:hidden;font-family:'Inter Tight',sans-serif}
.m .nav{position:absolute;left:14px;right:14px;top:10px;display:flex;justify-content:space-between;align-items:center;font-size:7px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.6px}
.m .nav b{font-size:9px;color:#fff;letter-spacing:0}
.m .nav span{padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff}
.m h4{position:absolute;left:16px;font-weight:800;color:#fff;letter-spacing:-.8px;line-height:.98}
.m .btn{position:absolute;left:16px;font-size:7.5px;font-weight:700;padding:5px 10px;border-radius:9px}
/* 1: glossy orb with orbit rings */
.m1{background:radial-gradient(160px 120px at 75% 55%,rgba(124,92,255,.35),transparent 70%),#07071a}
.m1 .orb{position:absolute;right:26px;top:46px;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0%,#c4b5fd 10%,#7c5cff 38%,#2a1a7a 72%,#0c0830 100%);box-shadow:0 0 40px rgba(124,92,255,.7),inset -10px -14px 30px rgba(0,0,0,.5)}
.m1 .ring{position:absolute;right:-2px;top:86px;width:168px;height:34px;border-radius:50%;border:1.5px solid rgba(103,232,249,.75);transform:rotate(-14deg);box-shadow:0 0 12px rgba(103,232,249,.5)}
.m1 .ring.r2{right:8px;top:94px;width:148px;height:22px;border-color:rgba(192,132,252,.55)}
.m1 h4{top:62px;font-size:24px;width:150px}
.m1 h4 em{font-style:normal;background:linear-gradient(90deg,#67e8f9,#a78bfa);-webkit-background-clip:text;color:transparent}
.m1 .btn{top:130px;background:#fff;color:#07071a}
/* 2: liquid gradient blob with motion trails */
.m2{background:#0a0812}
.m2 .blob{position:absolute;left:14px;top:30px;width:112px;height:112px;border-radius:46% 54% 60% 40%/50% 42% 58% 50%;
  background:conic-gradient(from 210deg,#22d3ee,#7c5cff,#f472b6,#fbbf24,#22d3ee);filter:blur(1px) saturate(1.1);transform:rotate(-18deg);box-shadow:0 0 50px rgba(244,114,182,.45)}
.m2 .blob:after{content:"";position:absolute;inset:18%;border-radius:inherit;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 45%)}
.m2 .trail{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));filter:blur(.4px)}
.m2 h4{top:140px;font-size:17px;width:120px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.m2 .btn{top:174px;display:none;background:linear-gradient(90deg,#f472b6,#7c5cff);color:#fff}
/* 3: layered 3D glass cards with particles */
.m3{background:radial-gradient(180px 140px at 70% 40%,rgba(34,211,238,.28),transparent 70%),linear-gradient(160deg,#0b1030,#060818)}
.m3 .stack{position:absolute;left:12px;top:36px;width:120px;height:120px;transform:perspective(300px) rotateY(22deg) rotateX(12deg) scale(.85)}
.m3 .stack i{position:absolute;width:96px;height:66px;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.m3 .stack i:nth-child(1){left:0;top:0;background:linear-gradient(135deg,rgba(34,211,238,.55),rgba(124,92,255,.25))}
.m3 .stack i:nth-child(2){left:18px;top:24px}
.m3 .stack i:nth-child(3){left:36px;top:48px;background:linear-gradient(135deg,rgba(192,132,252,.5),rgba(255,255,255,.08))}
.m3 .dot{position:absolute;border-radius:50%;background:#a5f3fc;box-shadow:0 0 6px #67e8f9}
.m3 h4{top:150px;font-size:15px;width:140px}
.m3 .btn{top:126px;display:none;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.c1{left:30px;top:66px;transform:rotateY(34deg) scale(.86)}
.c2{left:150px;top:62px;transform:rotateY(22deg) scale(.93)}
.c3{left:282px;top:56px;transform:rotateY(10deg)}
/* copy */
.copy{position:absolute;left:640px;width:600px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
h1{font-size:44px;line-height:1.06;letter-spacing:-1.6px;font-weight:500}
h1 b{font-weight:800}
h1 em{font-style:normal;font-weight:800;background:linear-gradient(90deg,#67e8f9,#8b7bff 55%,#c084fc);-webkit-background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.chip{height:34px;padding:0 15px;border-radius:9px;font-size:15px;font-weight:600;display:flex;align-items:center;letter-spacing:-.2px;
  background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.14));border:1px solid rgba(167,139,250,.45)}
.chip.w{background:#fff;color:#0d0f12;border-color:#fff}
/* portrait, right */
.halo{position:absolute;left:1230px;top:-10px;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(150,140,255,.5),rgba(34,211,238,.12) 60%,transparent);filter:blur(8px)}
.person{position:absolute;left:1232px;top:6px;height:400px;filter:drop-shadow(0 0 22px rgba(0,0,0,.35))}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body><div class="b">
  <div class="bg"></div>
  <div class="rig">
    <div class="card c1"><div class="bar"><i></i><i></i><i></i></div><div class="v"><div class="m m3">
      <div class="nav"><b>Layer</b><span>Explore</span></div><i class="dot" style="left:160px;top:30px;width:3px;height:3px;opacity:0.9"></i><i class="dot" style="left:270px;top:40px;width:2px;height:2px;opacity:0.7"></i><i class="dot" style="left:190px;top:170px;width:2.5px;height:2.5px;opacity:0.8"></i><i class="dot" style="left:282px;top:150px;width:3px;height:3px;opacity:0.6"></i><i class="dot" style="left:150px;top:120px;width:2px;height:2px;opacity:0.5"></i><i class="dot" style="left:240px;top:20px;width:2px;height:2px;opacity:0.6"></i><div class="stack"><i></i><i></i><i></i></div>
      <h4>Experiences<br>That Move.</h4><div class="btn">See the work</div></div></div></div>
    <div class="card c2"><div class="bar"><i></i><i></i><i></i></div><div class="v"><div class="m m2">
      <div class="nav"><b>Flux</b><span>Start</span></div><i class="trail" style="left:130px;top:58px;width:70px;opacity:0.7"></i><i class="trail" style="left:150px;top:74px;width:50px;opacity:0.45"></i><i class="trail" style="left:120px;top:92px;width:84px;opacity:0.6"></i><i class="trail" style="left:170px;top:108px;width:40px;opacity:0.35"></i><i class="trail" style="left:120px;top:60px;width:40px;opacity:0.4"></i><i class="trail" style="left:114px;top:150px;width:46px;opacity:0.5"></i><div class="blob"></div>
      <h4>Build the<br>Future.</h4><div class="btn">Get started</div></div></div></div>
    <div class="card c3"><div class="bar"><i></i><i></i><i></i></div><div class="v"><div class="m m1">
      <div class="nav"><b>Orbit</b><span>Book a Call</span></div><div class="ring"></div><div class="orb"></div><div class="ring r2"></div>
      <h4>Design in <em>Motion.</em></h4><div class="btn">Work With Me</div></div></div></div>
  </div>
  <div class="halo"></div>
  <img class="person" src="person-marketing-guy.png">
  <div class="copy">
    <h1>Websites, Landing Pages,<br>and <em>META ADS</em><br><b>Built to Convert.</b></h1>
    <div class="chips"><div class="chip">AI-Powered Websites</div><div class="chip">Landing Pages</div><div class="chip">Digital Products</div><div class="chip w">Meta Ads</div></div>
  </div>
  <div class="grain"></div>
</div></body></html>
