<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
:root{--ink:#0d0f12;--muted:#4a4a5a;--cyan:#22d3ee;--violet:#7c5cff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden;background:#fff}
.c{position:relative;width:1200px;height:627px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#fff}
.wash{position:absolute;left:-200px;top:-220px;width:760px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.07),rgba(34,211,238,.04) 60%,transparent)}
.stage{position:absolute;inset:0;background:
  radial-gradient(420px 320px at 1210px 640px,rgba(34,211,238,.5),transparent 70%),
  radial-gradient(460px 360px at 860px 700px,rgba(139,92,246,.55),transparent 70%),
  radial-gradient(420px 300px at 960px 120px,rgba(59,90,246,.35),transparent 70%),
  linear-gradient(180deg,#0f1534,#100c26);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 50%,rgba(0,0,0,.35) 53.5%,#000 59%)}
.halo{position:absolute;left:800px;top:20px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(124,110,255,.35),transparent);filter:blur(10px)}
.person{position:absolute;left:712px;top:47px;height:580px}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* copy */
.copy{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:1.8px;color:#5b4ae0;margin-bottom:20px}
.eyebrow i{width:28px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
h1{font-size:54px;line-height:1.03;letter-spacing:-2px;font-weight:800;color:var(--ink)}
h1 em{font-style:normal;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
.sub{margin-top:20px;font-size:21px;line-height:1.35;color:var(--muted);letter-spacing:-.3px}
.sub b{color:var(--ink);font-weight:700}
.cta{margin-top:32px;align-self:flex-start;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 26px;border-radius:28px;
  background:linear-gradient(135deg,#14143a,#0b0b18);border:1px solid rgba(167,139,250,.4);color:#fff;font-size:17px;font-weight:700;letter-spacing:-.2px;
  box-shadow:0 14px 32px -10px rgba(91,74,224,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.cta span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22d3ee,#7c5cff)}
/* one 3D element: the booking card, floating beside him */
.rig{position:absolute;inset:0;perspective:1400px;perspective-origin:700px 420px}
.book{position:absolute;left:612px;top:338px;width:226px;padding:18px 18px 16px;border-radius:20px;background:rgba(255,255,255,.94);
  transform:rotateY(16deg) rotateX(6deg) rotateZ(-2deg);transform-style:preserve-3d;
  box-shadow:0 34px 60px -16px rgba(8,6,36,.7),0 0 0 1px rgba(255,255,255,.8),inset 0 1px 0 #fff}
.book .hd{display:flex;align-items:center;gap:10px}
.book .av{width:34px;height:34px;border-radius:50%;background:url(person.png) 50% 6%/240% auto no-repeat,linear-gradient(135deg,#c7d2fe,#ddd6fe);border:2px solid #fff;box-shadow:0 0 0 1.5px #a78bfa}
.book .t b{display:block;font-size:14px;letter-spacing:-.3px;color:var(--ink)}
.book .t small{font-size:11px;color:#86868b;font-weight:500}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.days i{font-style:normal;height:34px;border-radius:10px;background:#f2f2f7;font-size:11px;font-weight:600;color:#55556a;display:flex;align-items:center;justify-content:center}
.days i.on{background:linear-gradient(135deg,#22d3ee,#7c5cff);color:#fff;box-shadow:0 6px 14px -4px rgba(124,92,255,.6)}
.slot{margin-top:10px;height:34px;border-radius:10px;background:#0d0f12;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
</style></head>
<body><div class="c">
  <div class="wash"></div>
  <div class="stage"></div>
  <div class="halo"></div>
  <img class="person" src="person.png">
  <div class="rig"><div class="book">
    <div class="hd"><div class="av"></div><div class="t"><b>Strategy call</b><small>One-on-one with Ashutosh</small></div></div>
    <div class="days"><i>Mon</i><i>Tue</i><i class="on">Wed</i><i>Thu</i><i>Fri</i></div>
    <div class="slot">Confirm call
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div></div>
  <div class="copy">
    <div class="eyebrow"><i></i>ONE-ON-ONE STRATEGY CALL</div>
    <h1>Let’s figure out what your business <em>actually needs.</em></h1>
    <div class="sub"><b>Your goals. Your challenges.</b> Your next move.</div>
    <div class="cta">Book your one-on-one strategy call<span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
  <div class="grain"></div>
</div></body></html>
