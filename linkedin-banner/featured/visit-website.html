<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
:root{--ink:#0d0f12;--muted:#4a4a5a;--cyan:#22d3ee;--violet:#7c5cff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden;background:#fff}
.c{position:relative;width:1200px;height:627px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#fff}
.wash{position:absolute;left:-200px;top:-220px;width:760px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.07),rgba(34,211,238,.04) 60%,transparent)}
.stage{position:absolute;inset:0;background:
  radial-gradient(420px 320px at 1210px 640px,rgba(34,211,238,.5),transparent 70%),
  radial-gradient(460px 360px at 860px 700px,rgba(139,92,246,.55),transparent 70%),
  radial-gradient(420px 300px at 960px 120px,rgba(59,90,246,.35),transparent 70%),
  linear-gradient(180deg,#0f1534,#100c26);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 50%,rgba(0,0,0,.35) 53.5%,#000 59%)}
.halo{position:absolute;left:720px;top:40px;width:520px;height:480px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(124,110,255,.35),transparent);filter:blur(10px)}
.person{position:absolute;left:712px;top:47px;height:580px}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* copy */
.copy{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:1.8px;color:#5b4ae0;margin-bottom:20px}
.eyebrow i{width:28px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
h1{font-size:68px;line-height:.98;letter-spacing:-2.6px;font-weight:800;color:var(--ink)}
h1 em{font-style:normal;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
.sub{margin-top:20px;font-size:21px;line-height:1.35;color:var(--muted);letter-spacing:-.3px}
.sub b{color:var(--ink);font-weight:700}
.cta{margin-top:32px;align-self:flex-start;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 26px;border-radius:28px;
  background:linear-gradient(135deg,#14143a,#0b0b18);border:1px solid rgba(167,139,250,.4);color:#fff;font-size:17px;font-weight:700;letter-spacing:-.2px;
  box-shadow:0 14px 32px -10px rgba(91,74,224,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.cta span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22d3ee,#7c5cff)}
/* hero: Ashutosh's own homepage on one floating 3D browser, a faint frame behind for depth */
.rig{position:absolute;inset:0;perspective:1600px;perspective-origin:600px 313px}
.sp{position:absolute;left:668px;top:118px;width:500px;height:384px;transform-style:preserve-3d;transform-origin:0 50%;transform:rotateY(17deg) rotateX(4deg)}
.ghost{position:absolute;inset:0;border-radius:16px;transform:translate3d(34px,-30px,-90px);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ghost:before{content:"";position:absolute;left:0;right:0;top:0;height:28px;border-bottom:1px solid rgba(255,255,255,.08)}
.side{position:absolute;left:0;top:12px;bottom:12px;width:22px;transform-origin:0 50%;transform:rotateY(90deg);
  background:linear-gradient(90deg,#c9c6e2 0%,#9d99bf 15%,#6f6b92 55%,#4a4766 100%)}
.win{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#0b0912;
  box-shadow:0 48px 90px -20px rgba(4,3,22,.85),0 0 0 1px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.25)}
.bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 14px;background:#16141f;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.bar u{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:170px;height:14px;border-radius:7px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.bar u:before{content:"";width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:60px;opacity:.8}
.view{position:absolute;left:0;right:0;top:30px;bottom:0;overflow:hidden}
.view img{width:172.8%;margin-left:-36.4%;display:block}
.sheen{position:absolute;inset:0;border-radius:16px;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 34%)}
.cursor{position:absolute;left:238px;top:352px;width:20px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
</style></head>
<body><div class="c">
  <div class="wash"></div>
  <div class="stage"></div>
  <div class="halo"></div>
  <div class="rig"><div class="sp">
    <div class="ghost"></div>
    <div class="side"></div>
    <div class="win"><div class="bar"><i></i><i></i><i></i><u></u></div>
      <div class="view"><img src="website-screenshot.png"></div>
      <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12 14 L19 14 Z" fill="#fff" stroke="#0d0f12" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <div class="sheen"></div></div>
  </div></div>
  <div class="copy">
    <div class="eyebrow"><i></i>ASHUTOSH JAIN · WEB DESIGN STUDIO</div>
    <h1>Visit my<br><em>website.</em></h1>
    <div class="sub"><b>Let’s build something that works.</b></div>
    <div class="cta">Let’s get talking<span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
  <div class="grain"></div>
</div></body></html>
