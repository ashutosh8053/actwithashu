<!doctype html>
<html><head><meta charset="utf-8">
<link href="fonts/local.css" rel="stylesheet">
<style>
:root{
  --dark:#06070f; --accent:#22d3ee; --accent2:#7c5cff; --violet:#8b5cf6; --blue:#3b82f6; --pink:#ec4899; --emerald:#10b981; --ink:#0d0f12; --paper:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;background:var(--dark);overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:var(--dark)}
/* ---- background: recreated from reference ---- */
.stage{position:absolute;inset:0;background:
  radial-gradient(440px 260px at 430px 20px,rgba(59,90,246,.30),transparent 70%),
  linear-gradient(180deg,#05060d 0%,#070818 60%,#0a0b1f 100%)}
/* mint glow rising from bottom-left corner */
.glow{position:absolute;inset:0;filter:blur(34px)}
.glow i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.glow .a1{left:-220px;top:150px;width:640px;height:460px;background:radial-gradient(closest-side,rgba(34,211,238,.85),rgba(34,211,238,.25) 55%,transparent)}
.glow .a2{left:0px;top:110px;width:600px;height:420px;background:radial-gradient(closest-side,rgba(139,92,246,.62),rgba(124,92,255,.2) 60%,transparent)}
.glow .a3{left:-160px;top:300px;width:380px;height:220px;background:radial-gradient(closest-side,rgba(16,185,129,.55),transparent)}
.glow .a4{left:250px;top:250px;width:360px;height:260px;background:radial-gradient(closest-side,rgba(236,72,153,.32),transparent)}
.glow .a5{left:-120px;top:-60px;width:420px;height:300px;background:radial-gradient(closest-side,rgba(59,130,246,.30),transparent)}
/* dark stage resolving into the white offer panel */
.paper{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,transparent 46%,rgba(40,36,90,.6) 54%,#e9e8f3 64%,#fff 70%)}
.wash{position:absolute;right:-160px;bottom:-200px;width:620px;height:420px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.10),rgba(34,211,238,.06) 55%,transparent);filter:blur(10px)}
/* bloom that lights the browser from behind */
.bloom{position:absolute;left:560px;top:-40px;width:520px;height:420px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(124,92,255,.35),rgba(34,211,238,.12) 55%,transparent);filter:blur(20px)}
/* website mockup: one browser window, product-first */
/* physical display: slight backward tilt, receding left, right edge nearer (as in the reference) */
.rig{position:absolute;inset:0;perspective:1500px;perspective-origin:792px 198px}
.dev{position:absolute;left:524px;top:38px;width:464px;height:420px;transform-style:preserve-3d;
  transform-origin:100% 50%;transform:rotateY(-15deg) rotateX(4deg)}
.dev .side{position:absolute;right:0;top:14px;bottom:14px;width:30px;transform-origin:100% 50%;transform:rotateY(-90deg);
  background:linear-gradient(90deg,#4a4766 0%,#6f6b92 45%,#9d99bf 85%,#c9c6e2 100%)}
.dev .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#34334a,#16151f 60%,#0f0f18);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.3)}
.dev .sheen{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 42%),
             linear-gradient(90deg,rgba(124,92,255,.16),rgba(124,92,255,0) 38%)}
/* screen's soft shadow on the backdrop, light coming from the aurora at left */
.cast{position:absolute;left:720px;top:70px;width:300px;height:380px;border-radius:40px;background:rgba(28,20,80,.26);filter:blur(30px)}
.web{position:absolute;inset:7px;border-radius:14px;overflow:hidden;background:#fbfbfd}
.web .tb{height:28px;background:#f6f6f9;border-bottom:1px solid #ececf2;position:relative}
.web .tb i{position:absolute;top:10px;width:8px;height:8px;border-radius:50%;background:#d9d9e1}
.web .url{position:absolute;left:135px;top:7px;width:180px;height:14px;border-radius:7px;background:#ebebf1}
.web .nav{position:absolute;left:24px;right:24px;top:44px;height:18px}
.web .logo{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:#1d1d1f}
.web .ni{position:absolute;top:7px;height:4px;border-radius:2px;background:#c7c7d2}
.web .ncta{position:absolute;right:0;top:0;width:58px;height:18px;border-radius:9px;background:#0071e3}
.web .eyebrow{position:absolute;left:24px;top:96px;width:48px;height:5px;border-radius:3px;background:#86868b}
.web .h{position:absolute;left:24px;height:14px;border-radius:4px;background:#1d1d1f}
.web .p{position:absolute;left:24px;height:4px;border-radius:2px;background:#d2d2d7}
.web .b1{position:absolute;left:24px;top:212px;width:66px;height:20px;border-radius:10px;background:#0071e3}
.web .b2{position:absolute;left:98px;top:212px;width:56px;height:20px;border-radius:10px;border:1px solid #0071e3;opacity:.55}
.web .hero{position:absolute;left:226px;top:84px;width:200px;height:164px;border-radius:14px;overflow:hidden;background:#f5f5f7}
.web .fan{position:absolute;left:90px;top:22px;width:50px;height:90px;border-radius:7px;transform-origin:50% 120%;box-shadow:0 8px 16px rgba(29,29,31,.16);overflow:hidden}
.web .fan:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:rgba(255,255,255,.55)}
.web .fan:after{content:"";position:absolute;left:8px;top:18px;width:26px;height:5px;border-radius:3px;background:rgba(29,29,31,.28);box-shadow:0 9px 0 -1px rgba(29,29,31,.14),0 30px 0 6px rgba(255,255,255,.45)}
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px rgba(40,30,110,.18)}
.web .card{position:absolute;top:282px;width:126px;height:96px;border-radius:14px;background:#f5f5f7}
.cursor{position:absolute;left:407px;top:51px;width:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.rim{position:absolute;left:520px;top:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,92,255,.22),transparent)}
.person{position:absolute;left:460px;top:-58px;height:560px;filter:drop-shadow(18px 10px 22px rgba(18,12,56,.38)) drop-shadow(0 0 26px rgba(0,0,0,.35)) contrast(1.03)}
.logos{position:absolute;left:42px;top:38px;display:flex;gap:16px;align-items:center;color:#fff;font-weight:700;font-size:20px;letter-spacing:-.3px}.logos .dot{color:#a78bfa;font-weight:800}
.ph{color:rgba(255,255,255,.55);font-weight:500;font-size:15px;border:1px dashed rgba(255,255,255,.35);padding:6px 12px;border-radius:6px}
.right{position:absolute;left:1028px;top:0;width:520px;height:396px}
.top{position:absolute;right:0;top:40px;display:flex;align-items:center;gap:26px}
.cta{background:linear-gradient(135deg,#12122a,#0b0b16);border:1px solid rgba(167,139,250,.35);border-radius:30px;padding:10px 24px 11px;font-weight:500;font-size:21px;color:#fff;letter-spacing:-.2px;box-shadow:0 8px 28px rgba(109,74,255,.22),inset 0 1px 0 rgba(255,255,255,.12)}.cta b{font-weight:800;font-size:27px;margin-left:4px;background:linear-gradient(90deg,#67e8f9,#a78bfa 60%,#f0abfc);-webkit-background-clip:text;color:transparent}
h1{position:absolute;left:0;bottom:62px;font-size:49px;line-height:1.07;letter-spacing:-1.6px;font-weight:400;color:var(--ink)}
h1 b{font-weight:800}
h1 .hl{font-weight:800;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
</style></head>
<body><div class="b" id="b">
  <div class="stage"></div>
  <div class="glow"><i class="a5"></i><i class="a1"></i><i class="a3"></i><i class="a2"></i><i class="a4"></i></div>
  <div class="paper"></div>
  <div class="wash"></div>
  <div class="bloom"></div>
  <div class="cast"></div>
  <div class="rig"><div class="dev">
  <div class="side"></div>
  <div class="face">
  <div class="web">
    <div class="tb"><i style="left:12px"></i><i style="left:25px"></i><i style="left:38px"></i><div class="url"></div></div>
    <div class="nav"><div class="logo"></div>
      <div class="ni" style="left:150px;width:34px"></div><div class="ni" style="left:196px;width:30px"></div><div class="ni" style="left:238px;width:36px"></div>
      <div class="ncta"></div></div>
    <div class="eyebrow"></div>
    <div class="h" style="top:114px;width:168px"></div>
    <div class="h" style="top:133px;width:150px"></div>
    <div class="h" style="top:152px;width:110px"></div>
    <div class="p" style="top:178px;width:160px"></div>
    <div class="p" style="top:188px;width:132px"></div>
    <div class="b1"></div><div class="b2"></div>
    <div class="hero">
      <div class="fan" style="background:#e3e4e8;transform:rotate(-33deg)"></div>
      <div class="fan" style="background:#f3cfc9;transform:rotate(-11deg)"></div>
      <div class="fan" style="background:#e8e27d;transform:rotate(11deg)"></div>
      <div class="fan" style="background:#4a5679;transform:rotate(33deg)"></div>
    </div>
    <div class="card" style="left:24px"></div><div class="card" style="left:162px"></div><div class="card" style="left:300px"></div>
    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12 14 L19 14 Z" fill="#0d0f12" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div class="sheen"></div>
  </div>
  </div></div>
  <div class="rim"></div>
  <img class="person" src="person.png">
  <div class="grain"></div>
  <div class="logos" id="logos"></div>
  <div class="right">
    <div class="top"><div class="cta" id="cta"></div></div>
    <h1 id="h1"></h1>
  </div>
</div>
<script>
const C = window.BANNER || {};
document.getElementById('h1').innerHTML = C.headline || '';
document.getElementById('cta').innerHTML = C.cta || '';
if(!C.cta) document.getElementById('cta').style.display='none';
document.getElementById('logos').innerHTML = (C.logos||[]).map(l=>`<span class="${C.logosPlaceholder?'ph':''}">${l}</span>`).join('');
for (const [k,v] of Object.entries(C.colors||{})) document.documentElement.style.setProperty('--'+k, v);
</script>
</body></html>
