<!doctype html>
<html><head><meta charset="utf-8">
<link href="fonts/local.css" rel="stylesheet">
<style>
:root{
  --dark:#06070f; --accent:#22d3ee; --accent2:#7c5cff; --violet:#8b5cf6; --blue:#3b82f6; --pink:#ec4899; --emerald:#10b981; --ink:#0d0f12; --paper:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;background:var(--dark);overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:var(--dark)}
/* ---- background: recreated from reference ---- */
.stage{position:absolute;inset:0;background:
  radial-gradient(440px 260px at 430px 20px,rgba(59,90,246,.30),transparent 70%),
  linear-gradient(180deg,#05060d 0%,#070818 60%,#0a0b1f 100%)}
/* mint glow rising from bottom-left corner */
.glow{position:absolute;inset:0;filter:blur(34px)}
.glow i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.glow .a1{left:-220px;top:150px;width:640px;height:460px;background:radial-gradient(closest-side,rgba(34,211,238,.85),rgba(34,211,238,.25) 55%,transparent)}
.glow .a2{left:0px;top:110px;width:600px;height:420px;background:radial-gradient(closest-side,rgba(139,92,246,.62),rgba(124,92,255,.2) 60%,transparent)}
.glow .a3{left:-160px;top:300px;width:380px;height:220px;background:radial-gradient(closest-side,rgba(16,185,129,.55),transparent)}
.glow .a4{left:250px;top:250px;width:360px;height:260px;background:radial-gradient(closest-side,rgba(236,72,153,.32),transparent)}
.glow .a5{left:-120px;top:-60px;width:420px;height:300px;background:radial-gradient(closest-side,rgba(59,130,246,.30),transparent)}
/* angled projection screen, top edge rising to the right, fading into the white panel */
.screen{position:absolute;inset:0;overflow:hidden;
  clip-path:polygon(572px 37px,821px 0,1584px 0,1584px 396px,506px 396px);
  background:
    radial-gradient(260px 220px at 540px 380px,rgba(36,30,80,.55),transparent 75%),
    radial-gradient(320px 260px at 590px 70px,rgba(139,92,246,.32),transparent 70%),
    radial-gradient(240px 200px at 560px 300px,rgba(34,211,238,.22),transparent 70%),
    linear-gradient(90deg,#a9a6cf 0%,#b0addb 33%,#d3d2ee 42%,#ecebf7 52%,#f9f9fc 60%,#fff 66%)}
.edge{position:absolute;inset:0;pointer-events:none;
  clip-path:polygon(572px 37px,821px 0,823px 0,575px 39px,509px 396px,506px 396px);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(196,181,253,.45))}
.wash{position:absolute;right:-160px;bottom:-200px;width:620px;height:420px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.10),rgba(34,211,238,.06) 55%,transparent);filter:blur(10px)}
.sc{position:absolute;inset:0;transform:rotate(-4deg);transform-origin:572px 37px;filter:blur(.6px)}
.sc .chip{position:absolute;left:588px;top:58px;width:78px;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.85}
.sc .chip2{position:absolute;left:676px;top:60px;width:40px;height:12px;border-radius:6px;background:#394150;opacity:.5}
.sc .ring{position:absolute;left:556px;top:130px;width:120px;height:120px;border-radius:50%;border:5px solid transparent;overflow:hidden;background:linear-gradient(#ebe9f7,#ebe9f7) padding-box,linear-gradient(135deg,var(--accent),var(--accent2),var(--pink)) border-box}
.sc .ring img{width:150%;margin-left:-25%;margin-top:4px;opacity:.9}
.sc .bar{position:absolute;height:9px;border-radius:5px;background:#5a6070;opacity:.45}
.sc .btn{position:absolute;height:16px;border-radius:8px;background:#2f3540;opacity:.55}
.sc .big{position:absolute;left:735px;top:-6px;width:170px;height:180px;object-fit:cover;object-position:50% 0%;opacity:.85;filter:blur(.8px);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent)}
.sc .ttl{position:absolute;height:20px;border-radius:6px;background:#9aa0aa;opacity:.28}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.rim{position:absolute;left:560px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,92,255,.26),rgba(59,130,246,.10) 60%,transparent)}
.person{position:absolute;left:460px;top:-58px;height:560px;filter:drop-shadow(0 0 30px rgba(0,0,0,.45)) contrast(1.03)}
.logos{position:absolute;left:42px;top:38px;display:flex;gap:16px;align-items:center;color:#fff;font-weight:700;font-size:20px;letter-spacing:-.3px}.logos .dot{color:#a78bfa;font-weight:800}
.ph{color:rgba(255,255,255,.55);font-weight:500;font-size:15px;border:1px dashed rgba(255,255,255,.35);padding:6px 12px;border-radius:6px}
.right{position:absolute;left:1028px;top:0;width:520px;height:396px}
.top{position:absolute;right:0;top:40px;display:flex;align-items:center;gap:26px}
.cta{background:linear-gradient(135deg,#12122a,#0b0b16);border:1px solid rgba(167,139,250,.35);border-radius:30px;padding:10px 24px 11px;font-weight:500;font-size:21px;color:#fff;letter-spacing:-.2px;box-shadow:0 8px 28px rgba(109,74,255,.22),inset 0 1px 0 rgba(255,255,255,.12)}.cta b{font-weight:800;font-size:27px;margin-left:4px;background:linear-gradient(90deg,#67e8f9,#a78bfa 60%,#f0abfc);-webkit-background-clip:text;color:transparent}
h1{position:absolute;left:0;bottom:62px;font-size:49px;line-height:1.07;letter-spacing:-1.6px;font-weight:400;color:var(--ink)}
h1 b{font-weight:800}
h1 .hl{font-weight:800;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
</style></head>
<body><div class="b" id="b">
  <div class="stage"></div>
  <div class="glow"><i class="a5"></i><i class="a1"></i><i class="a3"></i><i class="a2"></i><i class="a4"></i></div>
  <div class="screen"><div class="sc">
    <div class="chip"></div><div class="chip2"></div>
    <div class="ring"><img src="person.png"></div>
    <div class="bar" style="left:560px;top:262px;width:96px;opacity:.6"></div>
    <div class="bar" style="left:560px;top:280px;width:120px"></div>
    <div class="bar" style="left:560px;top:294px;width:104px"></div>
    <div class="bar" style="left:560px;top:308px;width:112px"></div>
    <div class="bar" style="left:560px;top:330px;width:84px"></div>
    <div class="btn" style="left:560px;top:362px;width:120px"></div>
    <img class="big" src="person.png">
    <div class="btn" style="left:762px;top:176px;width:110px"></div>
    <div class="ttl" style="left:925px;top:22px;width:110px"></div>
    <div class="ttl" style="left:925px;top:50px;width:150px"></div>
    <div class="bar" style="left:925px;top:84px;width:90px;opacity:.18"></div>
  </div></div>
  <div class="edge"></div>
  <div class="wash"></div>
  <div class="rim"></div>
  <img class="person" src="person.png">
  <div class="grain"></div>
  <div class="logos" id="logos"></div>
  <div class="right">
    <div class="top"><div class="cta" id="cta"></div></div>
    <h1 id="h1"></h1>
  </div>
</div>
<script>
const C = window.BANNER || {};
document.getElementById('h1').innerHTML = C.headline || '';
document.getElementById('cta').innerHTML = C.cta || '';
if(!C.cta) document.getElementById('cta').style.display='none';
document.getElementById('logos').innerHTML = (C.logos||[]).map(l=>`<span class="${C.logosPlaceholder?'ph':''}">${l}</span>`).join('');
for (const [k,v] of Object.entries(C.colors||{})) document.documentElement.style.setProperty('--'+k, v);
</script>
</body></html>
