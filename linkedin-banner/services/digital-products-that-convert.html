<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
:root{--ink:#0d0f12;--muted:#4a4a5a;--cyan:#22d3ee;--violet:#7c5cff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden;background:#fff}
.c{position:relative;width:1200px;height:627px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#fff}
.wash{position:absolute;left:-200px;top:-220px;width:760px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.07),rgba(34,211,238,.04) 60%,transparent)}
/* the banner's navy-indigo stage with aurora, resolving into white */
.stage{position:absolute;inset:0;background:
  radial-gradient(420px 320px at 1210px 640px,rgba(34,211,238,.5),transparent 70%),
  radial-gradient(460px 360px at 960px 690px,rgba(139,92,246,.55),transparent 70%),
  radial-gradient(380px 260px at 920px 30px,rgba(59,90,246,.3),transparent 70%),
  linear-gradient(180deg,#0f1534,#100c26);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 50%,rgba(0,0,0,.35) 53.5%,#000 59%)}
.bloom{position:absolute;left:760px;top:70px;width:480px;height:460px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(124,92,255,.42),rgba(34,211,238,.12) 55%,transparent);filter:blur(18px)}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* copy: identical system to the landing-page creative */
.copy{position:absolute;left:72px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center}
.rule{width:56px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));margin-bottom:26px}
h1{font-size:64px;line-height:1.02;letter-spacing:-2.2px;font-weight:800;color:var(--ink)}
h1 span{font-weight:400}
h1 em{font-style:normal;font-weight:800;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
p{font-size:19.5px;line-height:1.5;color:var(--muted);letter-spacing:-.15px;max-width:450px}
p.a{margin-top:26px;color:#2b2b38}
p.b{margin-top:14px}
/* digital product: playbook cover in front, open framework page behind */
.rig{position:absolute;inset:0;perspective:1600px;perspective-origin:900px 313px}
.page{position:absolute;left:938px;top:116px;width:222px;height:306px;border-radius:14px;background:#fbfbfd;
  transform:rotateY(-14deg) rotateZ(5deg);box-shadow:0 30px 60px -18px rgba(8,6,36,.65),inset 0 0 0 1px rgba(255,255,255,.7);padding:26px 24px}
.page .k{font-size:9px;font-weight:700;letter-spacing:1.4px;color:#6d4aff}
.page .t{margin-top:8px;height:12px;width:150px;border-radius:4px;background:#1d1d1f}
.page .t2{margin-top:6px;height:12px;width:104px;border-radius:4px;background:#1d1d1f}
.step{display:flex;align-items:flex-start;gap:12px;margin-top:22px}
.step b{flex:none;width:28px;height:28px;border-radius:9px;font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#22d3ee,#7c5cff)}
.step div i{display:block;height:5px;border-radius:3px;background:#c9c9d6;margin-top:5px}
.step div i:first-child{height:7px;background:#3a3a48;margin-top:3px}
.cover{position:absolute;left:708px;top:150px;width:222px;height:300px;border-radius:14px;overflow:hidden;
  transform:rotateY(12deg) rotateZ(-4deg);
  background:radial-gradient(180px 160px at 22% 18%,rgba(34,211,238,.85),transparent 70%),radial-gradient(200px 170px at 90% 92%,rgba(236,72,153,.4),transparent 70%),linear-gradient(150deg,#3b2fd0,#6d4aff 55%,#9b7bff);
  box-shadow:0 40px 70px -18px rgba(8,6,36,.75),inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.45)}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.08) 60%,transparent)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 40%)}
.cover .k{position:absolute;left:30px;top:30px;font-size:9px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.85)}
.cover h2{position:absolute;left:30px;bottom:66px;width:180px;font-size:30px;line-height:1.02;letter-spacing:-1px;font-weight:800;color:#fff}
.cover .ln{position:absolute;left:30px;bottom:38px;width:60px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
</style></head>
<body><div class="c">
  <div class="wash"></div>
  <div class="stage"></div>
  <div class="bloom"></div>
  <div class="rig">
    <div class="page">
      <div class="k">THE FRAMEWORK</div><div class="t"></div><div class="t2"></div>
      <div class="step"><b>01</b><div style="flex:1"><i style="width:80%"></i><i style="width:95%"></i><i style="width:60%"></i></div></div>
      <div class="step"><b>02</b><div style="flex:1"><i style="width:70%"></i><i style="width:90%"></i><i style="width:55%"></i></div></div>
      <div class="step"><b>03</b><div style="flex:1"><i style="width:76%"></i><i style="width:85%"></i><i style="width:48%"></i></div></div>
    </div>
    <div class="cover"><div class="k">PLAYBOOK</div><h2>Your method, made usable.</h2><div class="ln"></div></div>
  </div>
  <div class="copy">
    <div class="rule"></div>
    <h1>Digital Products<br><span>That</span> <em>Convert</em></h1>
    <p class="a">Turn your expertise into a digital product people can learn from, use, and trust.</p>
    <p class="b">A smart way to package your knowledge while creating a stronger path from audience to client.</p>
  </div>
  <div class="grain"></div>
</div></body></html>
