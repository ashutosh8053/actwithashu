<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
:root{--ink:#0d0f12;--muted:#4a4a5a;--cyan:#22d3ee;--violet:#7c5cff;--blue:#0071e3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden;background:#fff}
.c{position:relative;width:1200px;height:627px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#fff}
.wash{position:absolute;left:-200px;top:-220px;width:760px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,92,246,.07),rgba(34,211,238,.04) 60%,transparent)}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* right half: photo with the redesigned monitor, faded into the white copy panel, tinted with the banner aurora */
.photo{position:absolute;left:573px;top:0;width:627px;height:627px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%)}
.photo img{width:100%;height:100%;display:block}
.photo:after{content:"";position:absolute;inset:0;mix-blend-mode:screen;
  background:radial-gradient(260px 200px at 100% 100%,rgba(34,211,238,.28),transparent 70%),radial-gradient(300px 220px at 70% 105%,rgba(124,92,255,.26),transparent 70%)}
/* copy */
.copy{position:absolute;left:72px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center}
.rule{width:56px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));margin-bottom:26px}
h1{font-size:64px;line-height:1.02;letter-spacing:-2.2px;font-weight:800;color:var(--ink)}
h1 span{font-weight:400}
h1 em{font-style:normal;font-weight:800;background:linear-gradient(90deg,#0ea5c6,#5b5bff 45%,#9b4dff);-webkit-background-clip:text;color:transparent}
p{font-size:19.5px;line-height:1.5;color:var(--muted);letter-spacing:-.15px;max-width:450px}
p.a{margin-top:26px;color:#2b2b38}
p.b{margin-top:14px}
</style></head>
<body><div class="c">
  <div class="wash"></div>
  <div class="photo"><img src="ashutosh-desk-screen.png"></div>
  <div class="copy">
    <div class="rule"></div>
    <h1>Landing Pages<br><span>for</span> <em>Coaches</em></h1>
    <p class="a">Professionally designed landing pages that turn your expertise and offer into a clear, credible online experience.</p>
    <p class="b">Built to build trust, communicate your value, and turn visitors into potential clients.</p>
  </div>
  <div class="grain"></div>
</div></body></html>
