<!doctype html>
<html><head><meta charset="utf-8">
<link href="../fonts/local.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden;background:#06070f}
.b{position:relative;width:1584px;height:396px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#06070f;color:#fff}
.bg{position:absolute;inset:0;background:
  radial-gradient(560px 320px at 1500px -40px,rgba(124,92,255,.5),transparent 70%),
  radial-gradient(520px 280px at 1150px 460px,rgba(34,211,238,.2),transparent 70%),
  radial-gradient(500px 340px at 300px 300px,rgba(59,90,246,.22),transparent 70%),
  linear-gradient(180deg,#0c1030,#0a0a1e)}
/* flowing light ribbons, top-right (brand take on the reference's colour ribbon) */
.rib{position:absolute;right:-20px;top:-46px;width:560px;height:320px;opacity:1}
/* tilted product screen on the left, fading into the dark */
.rig{position:absolute;inset:0;perspective:1300px;perspective-origin:300px 200px}
.scr{position:absolute;left:-60px;top:46px;width:720px;height:380px;border-radius:18px;overflow:hidden;background:#0b0912;
  transform:rotateX(14deg) rotateY(26deg) rotateZ(-15deg);transform-origin:30% 50%;
  box-shadow:0 40px 90px -10px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.3)}
.scr .bar{height:34px;background:#16141f;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:7px;padding:0 16px}
.scr .bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22)}
.scr img{width:100%;display:block}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,38,0) 0%,rgba(11,13,38,0) 30%,rgba(11,13,38,.8) 45%,rgba(11,13,38,.97) 52%,rgba(11,13,38,0) 100%)}
/* callout + dotted arrow */
.call{position:absolute;left:96px;top:30px;display:flex;align-items:center;gap:10px;background:#fff;color:#0d0f12;border-radius:8px;padding:9px 14px;
  font-size:13px;font-weight:800;letter-spacing:.6px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.call:after{content:"";position:absolute;right:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#7c5cff);box-shadow:0 0 0 3px #06070f}
.arrow{position:absolute;left:330px;top:12px;width:380px;height:150px}
/* copy */
.copy{position:absolute;left:700px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.l1{font-size:34px;font-weight:500;letter-spacing:-.8px;color:rgba(255,255,255,.92)}
.l2,.l3{font-size:48px;font-weight:800;letter-spacing:-1.8px;line-height:1.02}
.l2 em{font-style:normal;background:linear-gradient(90deg,#67e8f9,#8b7bff 55%,#c084fc);-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:10px;margin-top:20px}
.chip{height:38px;padding:0 18px;border-radius:9px;font-size:17px;font-weight:600;display:flex;align-items:center;letter-spacing:-.2px;
  background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.16));border:1px solid rgba(167,139,250,.45)}
.pill{margin-top:10px;height:40px;padding:0 26px;border-radius:9px;background:#fff;color:#0d0f12;font-size:17px;font-weight:700;display:flex;align-items:center;letter-spacing:-.2px}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body><div class="b">
  <div class="bg"></div>
  <svg class="rib" viewBox="0 0 520 300" fill="none">
    <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    <g stroke="url(#g)" stroke-width="1.8">
      <path d="M40 300 C160 210 260 170 520 40" opacity=".55"/><path d="M70 300 C180 215 280 180 520 62" opacity=".5"/>
      <path d="M100 300 C200 222 300 190 520 84" opacity=".45"/><path d="M130 300 C220 230 320 200 520 106" opacity=".4"/>
      <path d="M160 300 C240 238 340 212 520 128" opacity=".35"/><path d="M190 300 C260 246 360 224 520 150" opacity=".3"/>
      <path d="M220 300 C280 254 380 236 520 172" opacity=".25"/><path d="M250 300 C300 262 400 248 520 194" opacity=".2"/>
    </g>
  </svg>
  <div class="rig"><div class="scr"><div class="bar"><i></i><i></i><i></i></div><img src="website-screenshot.png"></div></div>
  <div class="fade"></div>
  <div class="call">BOOK A FREE STRATEGY CALL</div>
  <svg class="arrow" viewBox="0 0 420 150" fill="none">
    <path d="M10 30 C120 0 230 20 300 70 S380 140 400 140" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M390 128 L402 141 L386 146" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="copy">
    <div class="l1">Turning Clicks Into Clients With</div>
    <div class="l2"><em>Websites &amp; Meta Ads</em></div>
    <div class="l3">Built to Actually Convert.</div>
    <div class="chips"><div class="chip">Conversion-First Design</div><div class="chip">Strategic Meta Ads</div></div>
    <div class="pill">One System, From Click to Client</div>
  </div>
  <div class="grain"></div>
</div></body></html>
