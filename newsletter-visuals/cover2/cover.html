<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* 1792x1024 cover. Left: type + the crowd stream. Right: the untouched photograph, lifted off its backdrop, with the stream running behind him. */
:root { --bg:#0D0B1A; --cream:#F3F1FA; --dim:rgba(243,241,250,.62); --gold:#B39BFF; }
html,body { margin:0; background:var(--bg); }
#cover { position:relative; width:1792px; height:1024px; overflow:hidden; background:var(--bg); }
/* photo: pixels untouched; only the flat purple backdrop was removed (cutout.py) */
#photo { position:absolute; left:800px; top:64px; width:960px; height:960px;
  background:url(cutout.png) center/contain no-repeat; }
#backlight { position:absolute; left:760px; top:60px; width:1040px; height:960px;
  background:radial-gradient(46% 52% at 52% 46%, rgba(142,108,232,.34) 0%, rgba(142,108,232,.10) 45%, rgba(13,11,26,0) 72%); }
#vignette { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 70% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
#stream { position:absolute; left:0; top:0; }
.title { position:absolute; left:96px; top:118px; margin:0;
  font:800 168px/0.86 'Bricolage Grotesque',Arial,sans-serif; font-stretch:80%;
  letter-spacing:-0.02em; color:var(--cream); }
.title span { display:block; }
.title .c { color:var(--cream); }
.sub { position:absolute; left:100px; top:470px; width:780px; margin:0;
  font:400 30px/1.32 'IBM Plex Sans',Arial,sans-serif; color:var(--dim); }
.sub b { font-weight:500; color:var(--gold); }
.stage { position:absolute; font:500 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em;
  color:rgba(243,241,250,.45); text-transform:uppercase; white-space:nowrap; }
.stage.buy { color:var(--gold); }
</style></head>
<body>
<div id="cover">
  <div id="backlight"></div>
  <canvas id="stream" width="1792" height="1024"></canvas>
  <div id="photo"></div>
  <div id="vignette"></div>
  <h1 class="title"><span>TAKE</span><span class="c">CUSTOMERS</span></h1>
  <p class="sub">How to take customers from just looking<br>to <b>shut up and take my money.</b></p>
  <div id="labels"></div>
</div>
<script>
// Seeded RNG so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cv = document.getElementById('stream'), dpr = window.devicePixelRatio || 1;
cv.width = 1792 * dpr; cv.height = 1024 * dpr; cv.style.width = '1792px'; cv.style.height = '1024px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);

// Path: a wide scattered crowd on the left narrows into one stream ending at the subject's arms.
const X0 = 70, X1 = 1080;
const cy = t => 780 - 150 * Math.pow(t, 1.6) + 18 * Math.sin(t * Math.PI * 1.2);   // gentle rise toward him
const spread = t => 150 * Math.pow(1 - t, 1.4) + 4;
const N = 2600;
for (let i = 0; i < N; i++) {
  const t = Math.pow(rnd(), 1.7);                       // most people are still "just looking"
  const x = X0 + (X1 - X0) * t + (rnd() - .5) * 26 * (1 - t);
  const n = (rnd() + rnd() + rnd() - 1.5) / 1.5;        // soft gaussian
  const y = cy(t) + n * spread(t);
  const buying = t > 0.965;                              // ~3% of the crowd reaches the end
  const a = buying ? 1 : 0.22 + 0.7 * Math.pow(t, 1.2);
  g.fillStyle = buying ? `rgba(179,155,255,${a})` : `rgba(243,241,250,${a})`;
  if (t > 0.55) {                                        // moving: drawn as short streaks
    const L = 2 + 16 * (t - 0.55);
    g.fillRect(x - L, y - 1, L, 2 + (buying ? 0.8 : 0));
  } else {
    g.beginPath(); g.arc(x, y, 1.5 + 1.0 * t, 0, Math.PI * 2); g.fill();
  }
}
// arrival glow at the conversion point
const gx = X1 + 4, gy = cy(1);
const rg = g.createRadialGradient(gx, gy, 0, gx, gy, 170);
rg.addColorStop(0, 'rgba(179,155,255,.45)'); rg.addColorStop(.35, 'rgba(179,155,255,.14)'); rg.addColorStop(1, 'rgba(179,155,255,0)');
g.fillStyle = rg; g.beginPath(); g.arc(gx, gy, 170, 0, Math.PI * 2); g.fill();

// Stage labels under the stream
const stages = [['Just looking', .03], ['Interested', .36], ['Ready', .64], ['Buying', .79]];
const box = document.getElementById('labels');
stages.forEach(([s, t], i) => {
  const d = document.createElement('div');
  d.className = 'stage' + (i === 3 ? ' buy' : '');
  d.textContent = s;
  d.style.left = (X0 + (X1 - X0) * t) + 'px';
  d.style.top = '930px';
  box.appendChild(d);
});

// fine film grain on the dark field only (stops before the photograph)
const grain = g.createImageData(1, 1);
for (let k = 0; k < 60000; k++) {
  const x = rnd() * 900, y = rnd() * 1024, v = rnd() * 255;
  g.fillStyle = `rgba(${v},${v},${v},0.035)`; g.fillRect(x, y, 1, 1);
}
</script>
</body></html>
