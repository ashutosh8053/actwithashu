<text x="60" y="78" class="mono" fill="#2D46F5" font-size="15" >The HALO STRATEGY</text><text x="60" y="132" class="disp" fill="#0E1525" font-size="44" >YOU MUST KNOW YOUR CUSTOMER INTIMATELY!</text><circle cx="600" cy="540" r="330" fill="none" stroke="#7C8CF8" stroke-width="1.5" stroke-dasharray="2 7"/><path d="M395.4,320.6 A300,300 0 0 1 804.6,320.6 L744.6,385 A212,212 0 0 0 455.4,385 Z" fill="#D3D9FD"/><text x="600" y="276" class="sans" fill="#2D46F5" font-size="18" text-anchor="middle">①</text><text x="600" y="304" class="sans" fill="#0E1525" font-size="22" text-anchor="middle">primary desire</text><path d="M819.4,335.4 A300,300 0 0 1 819.4,744.6 L755,684.6 A212,212 0 0 0 755,395.4 Z" fill="#D3D9FD"/><text x="856" y="532" class="sans" fill="#2D46F5" font-size="18" text-anchor="middle">②</text><text x="856" y="560" class="sans" fill="#0E1525" font-size="22" text-anchor="middle">Fears</text><path d="M804.6,759.4 A300,300 0 0 1 395.4,759.4 L455.4,695 A212,212 0 0 0 744.6,695 Z" fill="#D3D9FD"/><text x="600" y="788" class="sans" fill="#2D46F5" font-size="18" text-anchor="middle">③</text><text x="600" y="816" class="sans" fill="#0E1525" font-size="22" text-anchor="middle">wishes</text><path d="M380.6,744.6 A300,300 0 0 1 380.6,335.4 L445,395.4 A212,212 0 0 0 445,684.6 Z" fill="#D3D9FD"/><text x="344" y="532" class="sans" fill="#2D46F5" font-size="18" text-anchor="middle">④</text><text x="344" y="560" class="sans" fill="#0E1525" font-size="22" text-anchor="middle">dreams</text><circle cx="600" cy="540" r="160" fill="none" stroke="#2D46F5" stroke-width="84"/><path id="h4-top" d="M440,540 A160,160 0 0 1 760,540" fill="none"/><path id="h4-bot" d="M440,540 A160,160 0 0 0 760,540" fill="none"/><text class="sans" font-size="16.5" fill="#EEF0F3" font-weight="600" dominant-baseline="middle"><textPath href="#h4-top" startOffset="50%" text-anchor="middle">⑤  The stuff they're thinking but not telling anyone.</textPath></text><text class="mono" font-size="12" fill="#D3D9FD" dominant-baseline="middle"><textPath href="#h4-bot" startOffset="50%" text-anchor="middle">Customer's deepest &amp; most</textPath></text><circle cx="600" cy="540" r="112" fill="#0E1525"/><text x="600" y="550" class="disp" fill="#EEF0F3" font-size="30" text-anchor="middle" letter-spacing="2">CUSTOMER</text>
