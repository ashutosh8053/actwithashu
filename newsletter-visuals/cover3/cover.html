<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap">
<style>
/* 1792x1024 cover. The sentence is the only text; its weight grows from light italic (just looking) to black (take my money). */
:root { --bg:#0B0A09; --cream:#EFE6D4; --dim:rgba(239,230,212,.62); --gold:#D9A441; }
html,body { margin:0; background:var(--bg); }
#cover { position:relative; width:1792px; height:1024px; overflow:hidden; background:var(--bg); }
/* photo: never retouched; only cropped (orig x 0-94.7%, y 15-100%) and faded into the dark at its left edge */
#photo { position:absolute; left:937px; top:-180.7px; width:903.5px; height:1204.7px;
  background:url(portrait.jpg) center/cover no-repeat; }
#fade { position:absolute; left:930px; top:0; width:260px; height:1024px;
  background:linear-gradient(90deg, var(--bg) 0%, rgba(11,10,9,.88) 30%, rgba(11,10,9,0) 100%); }
#vignette { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 78% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
#stream { position:absolute; left:0; top:0; }
.hl { position:absolute; left:96px; top:128px; margin:0; color:var(--cream);
  font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif; font-optical-sizing:auto; font-weight:400; }
.hl > span { display:block; white-space:nowrap; }
.s { font-size:34px; font-weight:400; letter-spacing:.01em; color:var(--dim); }
.l1 { line-height:1; margin-bottom:6px; }
.l2 { font-size:104px; font-weight:600; line-height:1; letter-spacing:-0.015em; }
.l3 { font-size:88px; font-style:italic; font-weight:400; line-height:1.12; color:rgba(239,230,212,.72); }
.l4, .l5 { font-size:108px; font-weight:900; line-height:1.0; letter-spacing:-0.02em; }
.l4 { margin-top:14px; }
.l5 { color:var(--gold); }
.l3 .s, .l4 .s { font-style:normal; margin-right:14px; vertical-align:baseline; }
</style></head>
<body>
<div id="cover">
  <div id="photo"></div>
  <div id="fade"></div>
  <canvas id="stream" width="1792" height="1024"></canvas>
  <div id="vignette"></div>
  <h1 class="hl">
    <span class="l1 s">How to</span>
    <span class="l2">take customers</span>
    <span class="l3"><span class="s">from</span>just looking</span>
    <span class="l4"><span class="s">to</span>shut up and</span>
    <span class="l5">take my money.</span>
  </h1>
</div>
<script>
// Seeded RNG so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cv = document.getElementById('stream'), dpr = window.devicePixelRatio || 1;
cv.width = 1792 * dpr; cv.height = 1024 * dpr; cv.style.width = '1792px'; cv.style.height = '1024px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);

// Path: a wide scattered crowd on the left narrows into one stream ending at the subject's arms.
const X0 = 70, X1 = 1150;
const cy = t => 772 - 30 * t + 22 * Math.sin(t * Math.PI * 1.2);   // gentle rise toward him
const spread = t => 150 * Math.pow(1 - t, 1.4) + 4;
const N = 2600;
for (let i = 0; i < N; i++) {
  const t = Math.pow(rnd(), 1.7);                       // most people are still "just looking"
  const x = X0 + (X1 - X0) * t + (rnd() - .5) * 26 * (1 - t);
  const n = (rnd() + rnd() + rnd() - 1.5) / 1.5;        // soft gaussian
  const y = cy(t) + n * spread(t);
  const buying = t > 0.965;                              // ~3% of the crowd reaches the end
  const a = buying ? 1 : 0.22 + 0.7 * Math.pow(t, 1.2);
  g.fillStyle = buying ? `rgba(217,164,65,${a})` : `rgba(239,230,212,${a})`;
  if (t > 0.55) {                                        // moving: drawn as short streaks
    const L = 2 + 16 * (t - 0.55);
    g.fillRect(x - L, y - 1, L, 2 + (buying ? 0.8 : 0));
  } else {
    g.beginPath(); g.arc(x, y, 1.5 + 1.0 * t, 0, Math.PI * 2); g.fill();
  }
}
// arrival glow at the conversion point
const gx = X1 + 4, gy = cy(1);
const rg = g.createRadialGradient(gx, gy, 0, gx, gy, 46);
rg.addColorStop(0, 'rgba(217,164,65,.55)'); rg.addColorStop(1, 'rgba(217,164,65,0)');
g.fillStyle = rg; g.beginPath(); g.arc(gx, gy, 46, 0, Math.PI * 2); g.fill();


// fine film grain on the dark field only (stops before the photograph)
const grain = g.createImageData(1, 1);
for (let k = 0; k < 60000; k++) {
  const x = rnd() * 980, y = rnd() * 1024, v = rnd() * 255;
  g.fillStyle = `rgba(${v},${v},${v},0.035)`; g.fillRect(x, y, 1, 1);
}
</script>
</body></html>
